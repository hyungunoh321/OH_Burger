<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OH Burger - 버거 상세</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container" id="main"></main>

<script src="js/common.js"></script>
<script>
  layout('burgers.html');

  const b = byId(param('id') || 13);
  const main = document.getElementById('main');

  if (!b) {
    main.innerHTML = '<h1 class="page-title">버거를 찾을 수 없습니다</h1><p><a class="btn" href="burgers.html">버거 도감으로</a></p>';
  } else {
    document.title = `OH Burger - ${b.name}`;
    const val = (v, unit) => (v == null ? '정보 없음' : v + unit);
    const badges = Object.entries(METRICS)
      .map(([k, m]) => `<div>${m.label}${tierBadge(calcTiers(k)[b.id], k)}</div>`).join('');
    const related = POSTS.filter(p => p.burgers.includes(b.id));

    main.innerHTML = `
      <p class="hint"><a href="burgers.html">버거 도감</a> › ${b.brand}</p>
      <div class="detail">
        <div>${thumb('lg')}</div>
        <div>
          <span class="tag">${b.brand}</span>
          <h1>${b.name}</h1>
          <p class="page-desc">${PATTY[b.patty]} 패티 · 단품 ${won(b.price)}</p>

          <div class="tier-badges">${badges}</div>

          <table class="nutri">
            <tr><th>열량</th><td>${val(b.kcal, ' kcal')}</td></tr>
            <tr><th>단백질</th><td>${val(b.protein, ' g')}</td></tr>
            <tr><th>포화지방</th><td>${val(b.satfat, ' g')}</td></tr>
            <tr><th>당류</th><td>정보 없음</td></tr>
            <tr><th>나트륨</th><td>정보 없음</td></tr>
          </table>

          <div class="row">
            <button class="btn big" id="like">👍 추천 <b id="likes">${b.likes}</b></button>
            <span class="hint">조회 ${b.views}</span>
          </div>
        </div>
      </div>

      <div class="row between">
        <h2 class="section-title">이 버거의 꿀조합 · 꿀팁</h2>
        <a class="btn" href="write.html?burger=${b.id}">이 버거로 글쓰기</a>
      </div>
      <div class="card">
        <table class="list">
          ${related.map(p => `<tr>
            <td><span class="cat">${p.cat}</span></td>
            <td class="title"><a href="post.html?id=${p.id}">${p.title}</a> <span class="cnt">[${p.comments}]</span></td>
            <td class="hide-sm">${p.writer}</td>
            <td>👍 ${p.likes}</td>
          </tr>`).join('') || '<tr><td class="title hint">아직 등록된 글이 없습니다. 첫 꿀팁을 남겨 보세요.</td></tr>'}
        </table>
      </div>`;

    // 추천 토글 (실제 구현에서는 서버에 요청하고 최신 추천 수를 받아 갱신)
    const btn = document.getElementById('like');
    btn.addEventListener('click', () => {
      const on = btn.classList.toggle('on');
      document.getElementById('likes').textContent = b.likes + (on ? 1 : 0);
    });
  }
</script>
</body>
</html>
