<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OH Burger - 게시글</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container" id="main"></main>

<script src="js/common.js"></script>
<script>
  layout('posts.html');

  const p = POSTS.find(x => x.id === Number(param('id') || 8));
  const main = document.getElementById('main');

  if (!p) {
    main.innerHTML = '<h1 class="page-title">게시글을 찾을 수 없습니다</h1><p><a class="btn" href="posts.html">목록으로</a></p>';
  } else {
    document.title = `OH Burger - ${p.title}`;
    main.innerHTML = `
      <div class="card pad">
        <span class="cat">${p.cat}</span>
        <h1 class="page-title" style="margin-top:8px">${p.title}</h1>
        <div class="post-meta">
          <span>${p.writer}</span><span>${p.date}</span><span>조회 ${p.views}</span>
        </div>
        <div class="chips" style="margin-bottom:14px">
          ${p.burgers.map(id => `<a class="tag" href="burger.html?id=${id}">🍔 ${byId(id).brand} ${byId(id).name}</a>`).join('')}
        </div>

        <div class="post-body">본문이 표시되는 자리입니다.

주문할 때 이렇게 말하면 됩니다.
1. 기본 버거를 고릅니다.
2. 추가할 재료를 말합니다.
3. 받자마자 바로 먹습니다.</div>

        <p class="center" style="margin:20px 0">
          <button class="btn big" id="like">👍 추천 <b id="likes">${p.likes}</b></button>
        </p>

        <div class="row between">
          <a class="btn" href="posts.html">목록</a>
          <div class="row">
            <a class="btn" href="write.html?id=${p.id}">수정</a>
            <button class="btn">삭제</button>
          </div>
        </div>
        <p class="hint" style="text-align:right;margin:6px 0 0">수정은 작성자에게만, 삭제는 작성자와 관리자에게만 보입니다</p>
      </div>

      <h2 class="section-title">댓글 ${p.comments}</h2>
      <div class="card pad">
        <div class="comment">
          <span class="who">버거왕</span><span class="when">2026-11-13 18:20</span>
          <div>이 조합 진짜 맛있어요.</div>
        </div>
        <div class="comment">
          <span class="who">햄최몇</span><span class="when">2026-11-13 19:02</span>
          <button class="btn" style="float:right;padding:2px 8px;font-size:12px">삭제</button>
          <div>내일 점심으로 먹어 봐야겠네요.</div>
        </div>
        <form class="row" style="margin-top:14px" onsubmit="return false">
          <input class="input" placeholder="댓글을 입력하세요 (500자 이내, 로그인 필요)">
          <button class="btn primary">등록</button>
        </form>
      </div>`;

    const btn = document.getElementById('like');
    btn.addEventListener('click', () => {
      const on = btn.classList.toggle('on');
      document.getElementById('likes').textContent = p.likes + (on ? 1 : 0);
    });
  }
</script>
</body>
</html>
